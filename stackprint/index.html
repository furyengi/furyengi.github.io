<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stackprint</title><style>body{margin:0;background:#f2f0e9;color:#10110e;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:42px 24px}h1{font-size:clamp(60px,12vw,130px);line-height:.8;letter-spacing:-.09em;margin:80px 0 20px}em{font-family:Georgia,serif;font-weight:400}.tag{font:700 12px monospace;letter-spacing:.1em}.app{background:#10110e;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:55px}.pane{background:#181a17;color:#e7e8e2;min-height:480px;padding:20px}.out{background:#faf9f4;color:#10110e}.label{font:700 10px monospace;letter-spacing:.1em;color:#8a8d83}.out .label{color:#6d7067}textarea{width:100%;height:420px;resize:none;border:0;outline:0;background:#181a17;color:#e7e8e2;font:12px/1.7 monospace;margin-top:18px}.error{background:#fff1ee;border:1px solid #e5a59a;padding:20px;margin-top:18px}.error b{color:#a52c20;font:10px monospace}.error h2{margin:8px 0 0;font-size:22px;letter-spacing:-.04em}.frames{border:1px solid #c9c8bf;margin-top:18px}.frame{padding:12px;border-bottom:1px solid #c9c8bf;font:12px monospace}.frame:last-child{border:0}.safe{white-space:pre-wrap;max-height:160px;overflow:auto;font:11px/1.6 monospace;border-top:1px solid #c9c8bf;margin-top:18px;padding-top:16px}button{background:#d8ff4d;border:1px solid #10110e;padding:9px 12px;font:700 11px monospace;cursor:pointer;float:right}@media(max-width:700px){.app{grid-template-columns:1fr}h1{margin-top:60px}}</style><main><div class="tag">✦ STACKPRINT / PRIVATE BY DEFAULT</div><h1>Make stack traces<br><em>shareable.</em></h1><p>A browser-only formatter for errors worth sending. Common secrets and local paths are redacted before you copy.</p><section class="app"><div class="pane"><span class="label">INPUT / RAW STACK TRACE</span><textarea id="input"></textarea></div><div class="pane out"><button id="copy">Copy for issue ↗</button><span class="label">STACKPRINT</span><div class="error"><b>LIKELY ROOT ERROR</b><h2 id="error"></h2></div><div class="frames" id="frames"></div><pre class="safe" id="safe"></pre></div></section></main><script>const el=document.querySelector('#input'),safe=document.querySelector('#safe'),err=document.querySelector('#error'),frames=document.querySelector('#frames');el.value="TypeError: Cannot read properties of undefined (reading 'id')\n    at getUser (C:\\\\Users\\\\mahmud\\\\api\\\\src\\\\user.ts:42:18)\nAuthorization: Bearer sk_live_secretToken";function run(){let v=el.value.replace(/(Bearer\\s+)[\\w.-]+/gi,'$1••••••••').replace(/sk_(?:live|test)_[\\w-]+/gi,'sk_••••••••').replace(/[A-Z]:\\\\Users\\\\[^\\\\\\s]+/gi,'~/workspace');safe.textContent=v;err.textContent=v.split('\\n').find(x=>/error/i.test(x))||'No error detected';let a=[...v.matchAll(/at\\s+(.*?)\\s*\\((.+?):(\\d+):(\\d+)\\)/g)];frames.innerHTML=a.length?a.map((x,i)=>'<div class="frame">0'+(i+1)+' · '+x[1]+'<br><small>'+x[2]+':'+x[3]+':'+x[4]+'</small></div>').join(''):'<div class="frame">Paste a Node/JavaScript stack trace to map frames.</div>'}el.oninput=run;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText('## Stackprint\\n\\n'+safe.textContent);run();</script></html>
